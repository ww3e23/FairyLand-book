name: Ingest pet image submissions

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download submissions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PET_SUBMIT_NTFY_TOPIC: fairyland-xh28-pet-drop
        run: python scripts/ingest-ntfy-pets.py download

      - name: Commit inbox images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/art/pets/_inbox
          if git diff --cached --quiet; then
            echo "no inbox files"
            exit 0
          fi
          git commit -m "暫存玩家投稿的幻獸圖，待審核"
          git push

      - name: Open review issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ingest-ntfy-pets.py issues
