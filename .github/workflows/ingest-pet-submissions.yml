name: Ingest pet image submissions

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Publish submissions
        env:
          PET_SUBMIT_NTFY_TOPIC: fairyland-xh28-pet-drop
        run: python scripts/ingest-ntfy-pets.py publish

      - name: Commit live pet images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/art/pets src/data/pets.ts
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "自動上架玩家投稿的幻獸圖"
          git push
